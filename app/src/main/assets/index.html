<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070914">
<title>WorkHub</title>
<style>
:root{--bg:#070914;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#eef1ff;--mu:#8e96b8;--a:#5eead4;--b:#8b5cf6;--c:#f472b6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,Roboto,sans-serif;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#bg{position:fixed;inset:0;z-index:0}
#app{position:relative;z-index:1;min-height:100%;max-width:640px;margin:0 auto;padding:18px}
.view{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(26px) scale(.98)}to{opacity:1;transform:none}}
.glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px}
/* login */
.login{min-height:92vh;display:flex;flex-direction:column;justify-content:center;gap:22px}
.logo{width:84px;height:84px;border-radius:26px;margin:0 auto;display:grid;place-items:center;font-size:40px;background:conic-gradient(from 0deg,var(--a),var(--b),var(--c),var(--a));animation:spin 6s linear infinite;position:relative}
.logo span{position:absolute;inset:3px;border-radius:23px;background:#0b0e20;display:grid;place-items:center;animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:34px;text-align:center;letter-spacing:-.5px;background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.sub{text-align:center;color:var(--mu);margin-top:-14px;font-size:14px}
.form{padding:22px;display:flex;flex-direction:column;gap:12px}
input{width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--tx);font-size:16px;outline:none;transition:.25s}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(94,234,212,.18)}
.btn{padding:15px;border:0;border-radius:14px;font-size:16px;font-weight:700;color:#06121a;background:linear-gradient(90deg,var(--a),var(--b));cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:10px}
.err{color:#fb7185;font-size:13px;text-align:center;min-height:16px}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h2{font-size:22px;flex:1;letter-spacing:-.3px}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);transition:.2s}
.ib:active{transform:scale(.9)}
.search{margin-bottom:16px}
/* section cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sec{padding:18px 16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;opacity:0;animation:pop .5s forwards}
.sec:active{transform:scale(.96)}
.sec::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-40px;top:-40px;background:var(--g);filter:blur(34px);opacity:.55}
.sec .e{font-size:30px;position:relative}
.sec b{font-size:16px;position:relative}
.sec small{color:var(--mu);position:relative;font-size:12px}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
/* site tiles */
.list{display:flex;flex-direction:column;gap:10px}
.site{display:flex;align-items:center;gap:14px;padding:13px 14px;cursor:pointer;opacity:0;animation:pop .45s forwards;transition:transform .15s}
.site:active{transform:scale(.97)}
.ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:var(--g);flex:none}
.site .t{flex:1;min-width:0}
.site .t b{display:block;font-size:16px}
.site .t span{color:var(--mu);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{color:var(--mu);font-size:20px}
.acts{display:flex;gap:6px}
.acts .ib{width:36px;height:36px;font-size:15px;border-radius:11px}
.lbl{color:var(--mu);font-size:13px;margin:16px 4px 8px}
.note{font-size:12.5px;color:var(--mu);line-height:1.5;padding:12px 14px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#10142b;border:1px solid var(--line);padding:11px 18px;border-radius:14px;font-size:14px;opacity:0;transition:.3s;z-index:9;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ---------- DATA: edit here to add/remove sites ---------- */
const G=(a,b)=>`linear-gradient(135deg,${a},${b})`;
const SECTIONS=[
{id:"host",n:"Hosting & Backend",e:"🚀",g:G("#6366f1","#06b6d4"),s:[
 ["Vercel","https://vercel.com/dashboard","▲"],["Netlify","https://app.netlify.com","🌐"],["Supabase","https://supabase.com/dashboard","⚡"],
 ["GitHub","https://github.com","🐙"],["Cloudflare","https://dash.cloudflare.com","☁️"],["Firebase","https://console.firebase.google.com","🔥"]]},
{id:"meta",n:"Meta",e:"♾️",g:G("#2563eb","#a855f7"),s:[
 ["Meta Ads Manager","https://adsmanager.facebook.com","📣"],["Business Suite","https://business.facebook.com","💼"],["Facebook","https://www.facebook.com","📘"],
 ["Messenger","https://www.messenger.com","💬"],["WhatsApp","https://web.whatsapp.com","📱"],["Business Settings","https://business.facebook.com/settings","⚙️"],["Meta for Developers","https://developers.facebook.com","🧑‍💻"]]},
{id:"dev",n:"Developer Tools",e:"🛠️",g:G("#f59e0b","#ef4444"),s:[
 ["VS Code Web","https://vscode.dev","📝"],["Codespaces","https://github.com/codespaces","🧪"],["StackBlitz","https://stackblitz.com","⚙️"],["CodePen","https://codepen.io/pen","🖊️"],
 ["Replit","https://replit.com","🔁"],["Figma","https://www.figma.com","🎨"],["Postman Web","https://web.postman.co","📮"],["Regex101","https://regex101.com","🔎"],
 ["JSON Formatter","https://jsonformatter.org","🧾"],["TinyPNG","https://tinypng.com","🗜️"],["Can I Use","https://caniuse.com","✅"],["MDN Docs","https://developer.mozilla.org","📚"],["Tailwind Docs","https://tailwindcss.com/docs","🌬️"]]},
{id:"seo",n:"Domain, SEO & Stores",e:"📈",g:G("#10b981","#3b82f6"),s:[
 ["Search Console","https://search.google.com/search-console","🔍"],["Google Analytics","https://analytics.google.com","📊"],["PageSpeed Insights","https://pagespeed.web.dev","⏱️"],
 ["Play Console","https://play.google.com/console","▶️"],["Namecheap","https://www.namecheap.com","🏷️"]]}
];
const MY={id:"my",n:"My Websites",e:"🖥️",g:G("#ec4899","#f97316")};
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s),app=$("#app"),enc=new TextEncoder();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
let KEY=null;
async function mkKey(pw,salt){if(!crypto.subtle)return "plain";const m=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function E(t){if(KEY==="plain")return btoa(unescape(encodeURIComponent(t)));const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},KEY,enc.encode(t));return b64(iv)+"."+b64(c)}
async function D(t){if(KEY==="plain")return decodeURIComponent(escape(atob(t)));const[i,c]=t.split(".");return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(i)},KEY,ub(c)))}
function openSite(u){if(ls.get("hub_same",false))location.href=u;else{const w=window.open(u,"_blank","noopener");if(!w)location.href=u}}
async function copy(t,m){try{await navigator.clipboard.writeText(t);toast(m)}catch(e){toast("Copy not allowed")}}
/* ---------- background ---------- */
(function(){const c=$("#bg"),x=c.getContext("2d");let W,H,P=[];function r(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(70,W/9|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))}
r();addEventListener("resize",r);(function f(){x.clearRect(0,0,W,H);const g=x.createRadialGradient(W*.2,H*.1,0,W*.2,H*.1,H*.8);g.addColorStop(0,"rgba(139,92,246,.22)");g.addColorStop(1,"transparent");x.fillStyle=g;x.fillRect(0,0,W,H);
const g2=x.createRadialGradient(W*.9,H*.9,0,W*.9,H*.9,H*.7);g2.addColorStop(0,"rgba(94,234,212,.16)");g2.addColorStop(1,"transparent");x.fillStyle=g2;x.fillRect(0,0,W,H);
P.forEach((p,i)=>{p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;x.fillStyle="rgba(190,200,255,.6)";x.fillRect(p.x,p.y,1.6,1.6);for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<110){x.strokeStyle=`rgba(150,170,255,${.14*(1-d/110)})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}});requestAnimationFrame(f)})()})();
/* ---------- views ---------- */
function show(h){app.innerHTML=`<div class="view">${h}</div>`}
function login(){
 const a=ls.get("hub_auth",null),first=!a;
 show(`<div class="login"><div class="logo"><span>🧭</span></div><h1>WorkHub</h1><div class="sub">${first?"Create your private login":"Welcome back, boss"}</div>
 <div class="form glass"><input id="u" placeholder="Username" autocomplete="username" value="${a?esc(a.u):""}"><input id="p" type="password" placeholder="Password" autocomplete="${first?"new-password":"current-password"}">
 ${first?'<input id="p2" type="password" placeholder="Confirm password" autocomplete="new-password">':""}
 <div class="err" id="er"></div><button class="btn" id="go">${first?"Create & enter":"Unlock"}</button></div></div>`);
 const fail=m=>{$("#er").textContent=m;const f=$(".form");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake")};
 $("#go").onclick=async()=>{const u=$("#u").value.trim(),p=$("#p").value;if(!u||p.length<4)return fail("Username and a password of 4+ characters required");
  try{if(first){if(p!==$("#p2").value)return fail("Passwords do not match");const salt=crypto.getRandomValues(new Uint8Array(16));KEY=await mkKey(p,salt);ls.set("hub_auth",{u,salt:b64(salt),chk:await E("ok")})}
  else{if(u!==a.u)return fail("Wrong username or password");KEY=await mkKey(p,ub(a.salt));if(await D(a.chk)!=="ok")throw 0}}catch(e){KEY=null;return fail("Wrong username or password")}
  sessionStorage.setItem("hub_in","1");home()};
 app.querySelectorAll("input").forEach(i=>i.onkeydown=e=>e.key==="Enter"&&$("#go").click())}
function home(){
 const all=[...SECTIONS,MY],cnt=s=>s.id==="my"?ls.get("hub_sites",[]).length:s.s.length;
 show(`<div class="top"><h2>Command Hub</h2><div class="ib" id="st">⚙️</div><div class="ib" id="lo">⏻</div></div>
 <input class="search" id="q" placeholder="Search all sites…">
 <div class="grid" id="gr">${all.map((s,i)=>`<div class="sec glass" style="--g:${s.g};animation-delay:${i*70}ms" data-id="${s.id}"><div class="e">${s.e}</div><div><b>${s.n}</b><br><small>${cnt(s)} ${cnt(s)==1?"site":"sites"}</small></div></div>`).join("")}</div>
 <div id="res" class="list"></div>`);
 $("#gr").onclick=e=>{const c=e.target.closest(".sec");if(c)section(c.dataset.id)};
 $("#lo").onclick=()=>{KEY=null;sessionStorage.clear();login()};
 $("#st").onclick=()=>{const v=!ls.get("hub_same",false);ls.set("hub_same",v);toast(v?"Opens inside this window (app mode)":"Opens in a new tab")};
 $("#q").oninput=async e=>{const q=e.target.value.toLowerCase().trim(),r=$("#res");$("#gr").style.display=q?"none":"";if(!q){r.innerHTML="";return}
  const f=[];SECTIONS.forEach(s=>s.s.forEach(x=>x[0].toLowerCase().includes(q)&&f.push({n:x[0],u:x[1],i:x[2],g:s.g})));ls.get("hub_sites",[]).forEach(x=>x.n.toLowerCase().includes(q)&&f.push({n:x.n,u:x.u,i:"🖥️",g:MY.g}));
  r.innerHTML=f.length?f.map(siteHTML).join(""):'<div class="note glass">No match. Add it from “My Websites”.</div>';bind(r,f)}}
const siteHTML=(x,i)=>`<div class="site glass" data-i="${i}" style="animation-delay:${i*45}ms"><div class="ico" style="--g:${x.g}">${x.i}</div><div class="t"><b>${esc(x.n)}</b><span>${esc(x.u.replace(/^https?:\/\//,""))}</span></div>${x.extra||'<div class="go">›</div>'}</div>`;
function bind(root,arr){root.querySelectorAll(".site").forEach(el=>el.onclick=e=>{if(e.target.closest("[data-a]"))return;openSite(arr[el.dataset.i].u)})}
function section(id){
 if(id==="my")return mine();
 const s=SECTIONS.find(x=>x.id===id),arr=s.s.map(x=>({n:x[0],u:x[1],i:x[2],g:s.g}));
 show(`<div class="top"><div class="ib" id="bk">‹</div><h2>${s.e} ${s.n}</h2></div><div class="list">${arr.map(siteHTML).join("")}</div>`);
 $("#bk").onclick=home;bind(app,arr)}
async function mine(){
 const L=ls.get("hub_sites",[]);
 const arr=L.map((x,k)=>({n:x.n,u:x.u,i:"🖥️",g:MY.g,extra:`<div class="acts">${x.user?`<div class="ib" data-a="u" data-k="${k}" title="Copy username">👤</div>`:""}${x.pw?`<div class="ib" data-a="p" data-k="${k}" title="Copy password">🔑</div>`:""}<div class="ib" data-a="d" data-k="${k}" title="Delete">🗑️</div></div>`}));
 show(`<div class="top"><div class="ib" id="bk">‹</div><h2>${MY.e} ${MY.n}</h2></div>
 <div class="list">${arr.length?arr.map(siteHTML).join(""):'<div class="note glass">No sites yet. Add your website or admin panel below.</div>'}</div>
 <div class="lbl">Add site to access</div>
 <div class="form glass"><input id="n" placeholder="Name (e.g. My Shop Admin)"><input id="u" placeholder="Login URL (https://…/wp-admin)" inputmode="url"><input id="us" placeholder="Username (optional)" autocomplete="off"><input id="pw" type="password" placeholder="Password (optional, saved encrypted)" autocomplete="new-password"><button class="btn" id="ad">Add site</button></div>
 <div class="note glass">Passwords are encrypted on this device with your WorkHub password. Tap 👤 / 🔑 to copy, then paste on the site’s login page.</div>`);
 $("#bk").onclick=home;bind(app,arr);
 app.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const k=+b.dataset.k,x=L[k];
  if(b.dataset.a==="d"){if(confirm("Delete "+x.n+"?")){L.splice(k,1);ls.set("hub_sites",L);mine()}}
  else if(b.dataset.a==="u")copy(x.user,"Username copied");
  else{try{copy(await D(x.pw),"Password copied")}catch(e){toast("Cannot decrypt")}}});
 $("#ad").onclick=async()=>{let n=$("#n").value.trim(),u=$("#u").value.trim();if(!n||!u)return toast("Name and URL required");if(!/^https?:\/\//i.test(u))u="https://"+u;
  const p=$("#pw").value;if(p&&!KEY)return toast("Log in again to save a password");
  L.push({n,u,user:$("#us").value.trim(),pw:p?await E(p):""});ls.set("hub_sites",L);toast("Site added");mine()}}
login();
</script>
</body>
</html>
